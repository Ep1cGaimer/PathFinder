steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pathfinder-api
      - "--image=${_IMAGE}"
      - "--region=us-east1"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=2"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--concurrency=20"
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/pathfinder/api:${SHORT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
